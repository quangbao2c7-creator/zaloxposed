name: Build dylib
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: unzip -o ZaloXposedNew.zip
      - name: Build
        run: |
          cd ZaloXposedNew
          sed -i '' 's#CGRectGetMidX(self.view.bounds)#(self.view.bounds.size.width / 2)#' src/Tweak.m
          sed -i '' 's#-framework UIKit#-framework UIKit -framework CoreGraphics -O1#' build.sh
          grep -n "CGRectGetMidX\|framework" src/Tweak.m build.sh
          chmod +x build.sh
          ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ZaloXposed
          path: ZaloXposedNew/build/
